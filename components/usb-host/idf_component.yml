version: "1.0.0"
description: "USB HID keyboard, mouse and gamepad → BSP input injector for ESP32-P4"
dependencies:
  idf: ">=5.3"
  badgeteam/hid-host:
    git: https://github.com/badgeteam/esp32-component-hid-host.git
    version: "v0.1.0"
    rules:
      - if: target == esp32p4 || target == esp32s31
  usb_host_hid:
    version: "^1.0.1"
    rules:
      - if: target == esp32p4 || target == esp32s31
